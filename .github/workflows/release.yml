# Publish the workspace to crates.io.
#
# Manual only. There is no `on: push: tags:` trigger and that is deliberate: a
# tag push is easy to do by accident and publishing cannot be undone — a version
# yanks but never deletes, and a name is never freed. Someone has to come here
# and press the button.
#
# The workflow does no logic of its own; it runs the same script a developer
# runs at the keyboard (ADR-002, ADR-155).
#
# Needs a `CRATES_IO_TOKEN` repository secret — a crates.io API token with the
# `publish-new` and `publish-update` scopes.

name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    # The first release waits out the new-crate rate limit — five names, then
    # one per ten minutes — which is about one hundred minutes of sleeping for
    # this workspace. The default six-hour job limit covers it; the timeout is
    # here so a wedged run does not sit for all six.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ./scripts/publish.sh --dry-run
          else
            ./scripts/publish.sh
          fi
