# Minimal CI. Hosted CI runs the exact same command developers run locally
# (`just ci`); the workflow does no logic of its own.
# See docs/decisions/002-ci-via-just.md for the rationale.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Install just
        run: cargo install just
      - name: Quality gate
        run: just ci
