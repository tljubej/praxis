[package]
name = "praxis-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GC ABI types, type descriptors, and runtime context for Praxis"

[features]
# **Measurement only, and it makes the runtime slower on purpose.** ADR-115's
# A/B arm A: the `Text` scalar count is never remembered and `t[i]` never
# indexes bytes, which is the complexity the tree had before ADR-115 with the
# representation otherwise identical. Handover 26 §6 requires the baseline arm
# to be this branch with the package's single toggle reverted rather than an
# earlier commit; this is that toggle, and it lives here so both arms are
# buildable from the committed tree. Nothing in the workspace enables it.
adr115-arm-a = []

[dependencies]
praxis-source.workspace = true
praxis-input-parser.workspace = true
praxis-stdlib.workspace = true
# For §4.1's one identifier character class, which §7.4's `identifier` atomic
# parses with (F3, IP-11). Already an indirect dependency via
# `praxis-input-parser`; named here because this crate uses it directly, and a
# second copy of the rule is exactly what F3 exists to prevent.
praxis-syntax.workspace = true

# Doctests are not run (see the justfile and README): rustdoc has to analyze the
# whole crate before it can find out there are none, and the result is never
# cached, so `cargo test` paid ~6s per crate for it on every run.
[lib]
doctest = false
