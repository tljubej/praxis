[package]
name = "praxis-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GC ABI types, type descriptors, and runtime context for Praxis"

# The ADR-118 measurement toggle, and the only cargo feature this crate has.
#
# Default (feature off) is arm B: `ReprCVec` is the pinned `#[repr(C)]` triple
# W4b will read from generated code. With the feature on it is a
# `#[repr(transparent)]` newtype over `std::Vec`, and *nothing else in the tree
# differs* — which is what makes the A/B a measurement of the representation
# and not of anything else (handover 26 §6: the baseline is this tree with this
# package's single toggle point reverted, never the previous commit).
#
#     cargo build --release -p praxis-cli                                # arm B
#     cargo build --release -p praxis-cli \
#         --features praxis-runtime/std-vec-payload                      # arm A
[features]
std-vec-payload = []

[dependencies]
praxis-source.workspace = true
praxis-input-parser.workspace = true
praxis-stdlib.workspace = true
# For §4.1's one identifier character class, which §7.4's `identifier` atomic
# parses with (F3, IP-11). Already an indirect dependency via
# `praxis-input-parser`; named here because this crate uses it directly, and a
# second copy of the rule is exactly what F3 exists to prevent.
praxis-syntax.workspace = true

# Doctests are not run (see the justfile and README): rustdoc has to analyze the
# whole crate before it can find out there are none, and the result is never
# cached, so `cargo test` paid ~6s per crate for it on every run.
[lib]
doctest = false
