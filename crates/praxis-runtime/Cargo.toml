[package]
name = "praxis-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GC ABI types, type descriptors, and runtime context for Praxis"

[dependencies]
bumpalo.workspace = true
praxis-source.workspace = true
praxis-input-parser.workspace = true
praxis-stdlib.workspace = true
# For §4.1's one identifier character class, which §7.4's `identifier` atomic
# parses with (F3, IP-11). Already an indirect dependency via
# `praxis-input-parser`; named here because this crate uses it directly, and a
# second copy of the rule is exactly what F3 exists to prevent.
praxis-syntax.workspace = true

# Doctests are not run (see the justfile and README): rustdoc has to analyze the
# whole crate before it can find out there are none, and the result is never
# cached, so `cargo test` paid ~6s per crate for it on every run.
[lib]
doctest = false
