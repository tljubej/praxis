[package]
name = "praxis-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GC ABI types, type descriptors, and runtime context for Praxis"

# The measurement toggles. Both exist for the same reason and neither is a
# feature in the ordinary sense: handover 26 §6 requires an A/B's baseline arm to
# be *this tree with the package's single toggle reverted*, never an earlier
# commit — ADR-113 records measuring against the wrong baseline giving 14.4%
# where the right one gave 0.8%. So each toggle lives here, and both arms are
# buildable from the committed tree.
#
# Nothing in the workspace enables either, and `just ci` builds neither.
[features]
# ADR-118 arm A. Off (the default) `ReprCVec` is the pinned `#[repr(C)]` triple
# W4b will read from generated code; on, it is a `#[repr(transparent)]` newtype
# over `std::Vec` with every caller byte-for-byte identical.
#
#     cargo build --release -p praxis-cli                                # arm B
#     cargo build --release -p praxis-cli \
#         --features praxis-runtime/std-vec-payload                      # arm A
std-vec-payload = []
# ADR-115 arm A. **It makes the runtime slower on purpose**: the `Text` scalar
# count is never remembered and `t[i]` never indexes bytes, which is the
# complexity the tree had before ADR-115 with the representation otherwise
# identical. Do not enable it anywhere except when staging that arm.
adr115-arm-a = []

[dependencies]
praxis-source.workspace = true
praxis-input-parser.workspace = true
praxis-stdlib.workspace = true
# For §4.1's one identifier character class, which §7.4's `identifier` atomic
# parses with (F3, IP-11). Already an indirect dependency via
# `praxis-input-parser`; named here because this crate uses it directly, and a
# second copy of the rule is exactly what F3 exists to prevent.
praxis-syntax.workspace = true

# Doctests are not run (see the justfile and README): rustdoc has to analyze the
# whole crate before it can find out there are none, and the result is never
# cached, so `cargo test` paid ~6s per crate for it on every run.
[lib]
doctest = false
