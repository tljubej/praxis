[package]
name = "praxis-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Language Server Protocol implementation for Praxis."

# ---------------------------------------------------------------------------
# **This dependency list is a gate, not just a build input.**
#
# §19.11's first acceptance criterion is that editing a file updates diagnostics
# *without running JIT code*. `crates/praxis-lsp/tests/no_jit.rs` reads this
# manifest and asserts that `praxis-mir`, `praxis-codegen-cranelift` and
# `praxis-runtime` are absent — so the criterion holds by construction rather
# than by observing that one code path did not reach them today. Adding any of
# those three here turns that test red, which is the point.
# ---------------------------------------------------------------------------

[dependencies]
praxis-source.workspace = true
praxis-syntax.workspace = true
praxis-parser.workspace = true
praxis-ast.workspace = true
praxis-hir.workspace = true
praxis-types.workspace = true
praxis-stdlib.workspace = true
praxis-input-parser.workspace = true
rowan.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
lsp-types.workspace = true
praxis-input-parser.workspace = true
proptest.workspace = true

# Doctests are not run (see the justfile and README): rustdoc has to analyze the
# whole crate before it can find out there are none, and the result is never
# cached, so `cargo test` paid ~6s per crate for it on every run.
[lib]
doctest = false
