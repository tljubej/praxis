[package]
name = "praxis-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Language Server Protocol implementation for Praxis."
keywords = ["lsp", "language-server", "ide", "compiler", "language"]
categories = ["development-tools", "compilers"]

# ---------------------------------------------------------------------------
# **This dependency list is a gate, not just a build input.**
#
# Editing a file updates diagnostics *without running JIT code*.
# `crates/praxis-lsp/tests/no_jit.rs` reads this manifest and asserts that
# `praxis-mir`, `praxis-codegen-cranelift` and `praxis-runtime` are absent — so
# the rule holds by construction rather than by observing that one code path did
# not reach them today. Adding any of those three here turns that test red,
# which is the point.
# ---------------------------------------------------------------------------

[dependencies]
praxis-source.workspace = true
praxis-syntax.workspace = true
praxis-parser.workspace = true
praxis-ast.workspace = true
praxis-hir.workspace = true
praxis-typeck.workspace = true
praxis-stdlib.workspace = true
praxis-input-parser.workspace = true
rowan.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
lsp-types.workspace = true
praxis-input-parser.workspace = true
proptest.workspace = true

# Doctests are not run (the justfile says why): rustdoc has to analyze the whole
# crate before it can find out there are none, and the result is never cached,
# so `cargo test` pays ~6s per crate for it on every run.
[lib]
doctest = false
