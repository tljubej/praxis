[package]
name = "praxis-debugger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Crash snapshots and the interactive crash REPL for Praxis."
keywords = ["debugger", "compiler", "jit", "language", "adventofcode"]
categories = ["development-tools::debugging", "compilers"]
readme = "README.md"

[dependencies]
praxis-source.workspace = true
praxis-repr.workspace = true
praxis-runtime.workspace = true
praxis-typeck.workspace = true
praxis-stdlib.workspace = true
praxis-ast.workspace = true
praxis-syntax.workspace = true
praxis-parser.workspace = true
praxis-hir.workspace = true
praxis-mir.workspace = true
praxis-codegen-cranelift.workspace = true
anyhow.workspace = true
ratatui.workspace = true

# Doctests are not run (the justfile says why): rustdoc has to analyze the whole
# crate before it can find out there are none, and the result is never cached,
# so `cargo test` pays ~6s per crate for it on every run.
[lib]
doctest = false
