[package]
name = "praxis-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lexer and parser for the Praxis language (Milestone 0: lexer stub)."

[dependencies]
praxis-source.workspace = true
praxis-syntax.workspace = true
rowan.workspace = true

[dev-dependencies]
insta.workspace = true
praxis-test-support.workspace = true
proptest.workspace = true

# Doctests are not run (see the justfile and README): rustdoc has to analyze the
# whole crate before it can find out there are none, and the result is never
# cached, so `cargo test` paid ~6s per crate for it on every run.
[lib]
doctest = false
