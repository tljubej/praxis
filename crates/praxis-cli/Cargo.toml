[package]
name = "praxis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The `praxis` command-line entry point."

[[bin]]
name = "praxis"
path = "src/main.rs"

[dependencies]
praxis-source.workspace = true
praxis-syntax.workspace = true
praxis-parser.workspace = true
praxis-ast.workspace = true
praxis-hir.workspace = true
praxis-types.workspace = true
praxis-mir.workspace = true
praxis-runtime.workspace = true
praxis-debugger.workspace = true
praxis-stdlib.workspace = true
praxis-codegen-cranelift.workspace = true
# The shared front-end query layer (§14.2, ADR-097). `praxis check` calls it, so
# the CLI and the editor cannot disagree about what a file says.
praxis-lsp.workspace = true
anyhow.workspace = true
clap.workspace = true

[dev-dependencies]
insta.workspace = true
praxis-input-parser.workspace = true
praxis-test-support.workspace = true
serde_json.workspace = true
