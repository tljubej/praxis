[workspace]
resolver = "2"
members = [
    "crates/praxis-cli",
    "crates/praxis-source",
    "crates/praxis-syntax",
    "crates/praxis-parser",
    "crates/praxis-ast",
    "crates/praxis-typeck",
    "crates/praxis-input-parser",
    "crates/praxis-hir",
    "crates/praxis-runtime",
    "crates/praxis-repr",
    "crates/praxis-stdlib",
    "crates/praxis-mir",
    "crates/praxis-codegen-cranelift",
    "crates/praxis-debugger",
    "crates/praxis-lsp",
    "crates/praxis-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Tomislav Ljubej <tomislavl@tbtl.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tljubej/praxis"
homepage = "https://github.com/tljubej/praxis"
# Inherited by every crate. `categories` and `keywords` are the registry's own
# vocabulary — a category that is not one of its published slugs is rejected at
# publish time, and a crate gets at most five keywords of at most twenty
# characters each. The handful of crates whose subject is narrower than "the
# compiler" override one or both in their own manifest.
keywords = ["compiler", "jit", "language", "adventofcode", "programming-language"]
categories = ["compilers", "development-tools"]
# The floor the workspace actually needs, and no higher. Three things set it and
# they agree on the same number: edition 2024 needs 1.85, `ratatui` (the crash
# debugger's TUI) declares 1.88, and let-chains — which the lint policy below
# expects idiomatic code to use — stabilized in 1.88. CI installs the
# `rust-toolchain.toml` pin (`stable`) and there is no separate MSRV job, so this
# is a claim about the graph rather than something a build verifies: raise it
# when a dependency raises its own, and keep `clippy.toml` on the same number.
rust-version = "1.88"

[workspace.dependencies]
# Shared crates reference a single version from here.
anyhow = "1"
bumpalo = "3"
clap = { version = "4", features = ["derive"] }
cranelift = "0.134"
cranelift-frontend = "0.134"
cranelift-jit = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
crossbeam-channel = "0.5"
insta = "1"
proptest = "1"
# The crash debugger's full-screen TUI. `crossterm` is a default feature and
# ratatui re-exports it as `ratatui::crossterm`, so the terminal backend needs no
# second direct dependency here — and cannot drift out of step with the version
# ratatui itself was built against.
ratatui = "0.30"
rowan = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-ident = "1"

# The rust-analyzer transport crates: a synchronous, crossbeam-channel message
# loop and the protocol's types. No async runtime is pulled in by either, which
# is half the reason they are the ones used here.
lsp-server = "0.10"
lsp-types = "0.97"

# Internal crates. The path is what every consumer resolves against; the version
# is what the registry requires, and a published crate whose dependency carries
# only a path is rejected. `praxis-test-support` is the exception: it is test
# scaffolding, it is never a `[dependencies]` entry, and a dev-dependency with no
# version is dropped from the manifest a package ships — which is what keeps it
# off the registry without stranding the crates that test with it.
praxis-ast = { path = "crates/praxis-ast", version = "0.1.0" }
praxis-cli = { path = "crates/praxis-cli", version = "0.1.0" }
praxis-codegen-cranelift = { path = "crates/praxis-codegen-cranelift", version = "0.1.0" }
praxis-debugger = { path = "crates/praxis-debugger", version = "0.1.0" }
praxis-hir = { path = "crates/praxis-hir", version = "0.1.0" }
praxis-input-parser = { path = "crates/praxis-input-parser", version = "0.1.0" }
praxis-lsp = { path = "crates/praxis-lsp", version = "0.1.0" }
praxis-mir = { path = "crates/praxis-mir", version = "0.1.0" }
praxis-parser = { path = "crates/praxis-parser", version = "0.1.0" }
praxis-repr = { path = "crates/praxis-repr", version = "0.1.0" }
praxis-runtime = { path = "crates/praxis-runtime", version = "0.1.0" }
praxis-source = { path = "crates/praxis-source", version = "0.1.0" }
praxis-stdlib = { path = "crates/praxis-stdlib", version = "0.1.0" }
praxis-syntax = { path = "crates/praxis-syntax", version = "0.1.0" }
praxis-test-support = { path = "crates/praxis-test-support" }
praxis-typeck = { path = "crates/praxis-typeck", version = "0.1.0" }

[profile.dev]
# Faster from-scratch dev builds; link time matters more than codegen here.
debug = 1

# Third-party dependencies only — cargo excludes workspace members from `"*"`,
# so every Praxis crate is still built unoptimized and still debuggable.
#
# This is here for **Cranelift**, which a `praxis run` spends nearly all of its
# time inside and which is unusably slow when built without optimization. The
# corpus test (`crates/praxis-cli/tests/corpus.rs`) runs the binary once per
# program, so it pays that cost once for every program in the tree:
#
#     dev, deps unoptimized        rep15 246ms
#     dev, deps at opt-level 3     rep15  33ms
#     release                      rep15  21ms
#
# Optimizing the Cranelift crates alone measured the same as optimizing every
# dependency, so this is one dependency's cost and not a general debug tax —
# `praxis check`, which never reaches Cranelift, was ~6ms either way. The price
# is a slower first build of the dependency graph; it is cached thereafter.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 0
