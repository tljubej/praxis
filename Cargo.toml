[workspace]
resolver = "2"
members = [
    "crates/praxis-cli",
    "crates/praxis-source",
    "crates/praxis-syntax",
    "crates/praxis-parser",
    "crates/praxis-ast",
    "crates/praxis-types",
    "crates/praxis-input-parser",
    "crates/praxis-hir",
    "crates/praxis-runtime",
    "crates/praxis-repr",
    "crates/praxis-stdlib",
    "crates/praxis-mir",
    "crates/praxis-codegen-cranelift",
    "crates/praxis-debugger",
    "crates/praxis-lsp",
    "crates/praxis-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tljubej/praxis"
rust-version = "1.80"

[workspace.dependencies]
# Shared crates reference a single version from here.
anyhow = "1"
bumpalo = "3"
clap = { version = "4", features = ["derive"] }
cranelift = "0.134"
cranelift-frontend = "0.134"
cranelift-jit = "0.134"
cranelift-module = "0.134"
cranelift-native = "0.134"
insta = "1"
proptest = "1"
rowan = "0.16"
unicode-ident = "1"

# Internal crates — paths so every consumer resolves to the workspace copy.
praxis-ast = { path = "crates/praxis-ast" }
praxis-cli = { path = "crates/praxis-cli" }
praxis-codegen-cranelift = { path = "crates/praxis-codegen-cranelift" }
praxis-debugger = { path = "crates/praxis-debugger" }
praxis-hir = { path = "crates/praxis-hir" }
praxis-input-parser = { path = "crates/praxis-input-parser" }
praxis-lsp = { path = "crates/praxis-lsp" }
praxis-mir = { path = "crates/praxis-mir" }
praxis-parser = { path = "crates/praxis-parser" }
praxis-repr = { path = "crates/praxis-repr" }
praxis-runtime = { path = "crates/praxis-runtime" }
praxis-source = { path = "crates/praxis-source" }
praxis-stdlib = { path = "crates/praxis-stdlib" }
praxis-syntax = { path = "crates/praxis-syntax" }
praxis-test-support = { path = "crates/praxis-test-support" }
praxis-types = { path = "crates/praxis-types" }

[profile.dev]
# Faster from-scratch dev builds; link time matters more than codegen here.
debug = 1

# Third-party dependencies only — cargo excludes workspace members from `"*"`,
# so every Praxis crate is still built unoptimized and still debuggable.
#
# This is here for **Cranelift**, which a `praxis run` spends nearly all of its
# time inside and which is unusably slow when built without optimization. The
# corpus test (`crates/praxis-cli/tests/corpus.rs`) runs the binary once per
# program, so it pays that cost 36 times over:
#
#     dev, deps unoptimized        rep15 246ms    whole corpus 1.05s
#     dev, deps at opt-level 3     rep15  33ms    whole corpus 0.27s
#     release                      rep15  21ms    whole corpus 0.18s
#
# Optimizing the Cranelift crates alone measured the same as optimizing every
# dependency, so this is one dependency's cost and not a general debug tax —
# `praxis check`, which never reaches Cranelift, was ~6ms either way. The price
# is a slower first build of the dependency graph; it is cached thereafter.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 0
